security:
    # https://symfony.com/doc/current/security.html#where-do-users-come-from-user-providers
    encoders:
        App\Entity\User:
            algorithm: bcrypt
            cost: 12
    providers:
        in_memory: { memory: ~}
        in_database:
            entity:
                class: App\Entity\User
                property: email
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        api:
            pattern:   ^/api
            stateless: true
            provider: in_database
            guard:
                authenticators:
                    - App\Security\ApiKeyAuthenticator
        main:
            anonymous: true
            provider: in_database
            form_login:
                login_path: login
                check_path: login
                default_target_path: /
            json_login:
                check_path: /api/login
            logout:
                path: logout
                target: /
      

    access_control:
         - { path: ^/admin, roles: ROLE_ADMIN }
         - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
        # - { path: ^/profile, roles: ROLE_USER }
