vich_uploader:
    db_driver: orm
    
    mappings:
        product_images:
          uri_prefix: /images/articles
          upload_destination: '%kernel.project_dir%/public/images/articles'
          namer: Vich\UploaderBundle\Naming\OrignameNamer

      
        stations_images:
            uri_prefix: /images/stations
            upload_destination: '%kernel.project_dir%/public/images/stations'
            namer: Vich\UploaderBundle\Naming\OrignameNamer

